  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Write a letter</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #5E5B53; max-width: 640px;">Thank students with a handwritten note from your office. It lands in their Samaky Inbox as a sealed envelope they open themselves, and they keep it forever.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
      <form onSubmit="{{noSubmit}}" style="flex: 3 1 420px; min-width: 0; background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px;">Who is it for?</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{whos}}" as="w" hint-placeholder-count="3">
              <button type="button" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="{{w.style}}">{{w.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="note" style="font-weight: 600; font-size: 15px;">Your note</label>
          <textarea id="note" rows="5" onInput="{{setNote}}" style="box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; font: inherit; color: #1A1A1A; background: #FFFFFF; padding: 14px 16px; font-family: 'Caveat', 'Bradley Hand', cursive; font-size: 24px; line-height: 1.4; resize: vertical;">{{note}}</textarea>
          <div style="font-size: 13px; color: #5E5B53;">It shows up in handwriting, just like in the app. Tap the envelope on the right to see it.</div>
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px;">Add a sticker</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <sc-for list="{{stickers}}" as="s" hint-placeholder-count="3">
              <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" aria-label="{{s.label}}" style="{{s.style}}"><sc-if value="{{s.img}}" hint-placeholder-val="{{true}}"><img src="{{s.src}}" alt="" style="width: 44px; height: 44px; object-fit: contain; border-radius: {{s.radius}};"></sc-if><sc-if value="{{s.none}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; color: #5E5B53;">None</span></sc-if></button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="sig" style="font-weight: 600; font-size: 15px;">Sign it</label>
          <input id="sig" value="{{sig}}" onInput="{{setSig}}" style="box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; font: inherit; color: #1A1A1A; background: #FFFFFF; min-height: 48px; padding: 0 16px; font-size: 15px;">
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: flex-end; padding-top: 14px; border-top: 1px solid #E5E1D3;">
          <sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><span style="margin-right: auto; font-size: 14px; font-weight: 600; color: #471C72;">{{sentMsg}}</span></sc-if>
          <button type="button" onClick="{{draft}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #1A1A1A; background: #FFFFFF; color: #1A1A1A; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;">{{draftLabel}}</button>
          <button type="button" onClick="{{send}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 26px; border-radius: 999px; border: 0; background: #471C72; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>{{sendLabel}}</button>
        </div>
      </form>

      <aside aria-label="Preview" style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <div style="font-weight: 600; font-size: 15px;">What the student sees</div>
        <div style="position: relative; background: #FAF9F5; border: 1.5px solid #E0DCCD; border-radius: 30px; padding: 22px 20px 24px; min-height: 600px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; overflow: hidden;">

          <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
            <div class="lt-fade-anim" style="width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1 1 auto;">
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 18px;"><img src="brand/ust-shield.png" alt="" style="width: 32px; height: 32px; border-radius: 8px; background: #FFFFFF; object-fit: contain; border: 1px solid #E0DCCD;"><span style="font-size: 13px; color: #5E5B53;">University of St. Thomas</span></div>
              <h2 style="margin: 10px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 26px; line-height: 1.2; text-align: center;">St. Thomas sent you a letter</h2>
              <button type="button" class="lt-env" onClick="{{open}}" aria-label="Open the letter" style="margin: auto 0; padding: 0; border: 0; background: transparent; cursor: pointer; width: min(100%, 320px);">
                <span class="lt-env-body" style="position: relative; display: block; width: 100%; aspect-ratio: 1.6; border-radius: 6px; background: linear-gradient(170deg, #F6F3EA, #ECE7DA); box-shadow: 0 18px 30px rgba(60,50,30,.18), 0 2px 4px rgba(60,50,30,.08); transition: transform .2s ease;">
                  <svg aria-hidden="true" viewBox="0 0 320 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;"><path d="M2 2 L160 112 L318 2 M2 198 L140 98 M318 198 L180 98" fill="none" stroke="#D6CFBC" stroke-width="1.6"/></svg>
                  <img src="brand/wax-seal.png" alt="" style="position: absolute; left: 50%; top: 52%; width: 74px; height: 74px; margin: -37px 0 0 -37px; filter: drop-shadow(0 3px 4px rgba(80,20,10,.35));">
                </span>
              </button>
              <button type="button" onClick="{{open}}" style="min-height: 46px; padding: 0 22px; border-radius: 999px; border: 0; background: #1A1A1A; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;">Tap the envelope to open</button>
            </div>
          </sc-if>

          <sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
            <div style="width: 100%; display: flex; flex-direction: column; flex: 1 1 auto;">
              <div style="display: flex; justify-content: flex-end;">
                <button type="button" onClick="{{replay}}" aria-label="Seal it again and replay" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
              </div>
              <div style="position: relative; width: min(100%, 330px); height: 430px; margin: 4px auto 0; perspective: 900px;">
                <div aria-hidden="true" class="{{flapCls}}" style="position: absolute; left: 0; right: 0; bottom: 186px; height: 92px; background: #E4DECF; clip-path: polygon(0 100%, 50% 0, 100% 100%); transform-origin: bottom center;"></div>
                <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; border-radius: 6px; background: #E9E3D4; box-shadow: 0 18px 30px rgba(60,50,30,.16);"></div>
                <div style="position: absolute; inset: 0; overflow: hidden;">
                <div class="{{letterCls}}" style="position: absolute; left: 6%; right: 6%; bottom: 46px; height: 360px; box-sizing: border-box; border-radius: 4px; background-color: #FDFDF9; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 33px, #E2E6EB 33px, #E2E6EB 34px); background-position: 0 12px; padding: 14px 20px; box-shadow: 0 -2px 10px rgba(60,50,30,.08); font-family: 'Caveat', 'Bradley Hand', cursive; color: #1F1F1F; font-size: 23px; line-height: 34px; overflow: hidden;">
                  <sc-if value="{{hasSticker}}" hint-placeholder-val="{{true}}"><img src="{{stickerSrc}}" alt="" style="position: absolute; right: 12px; top: 10px; width: 46px; height: 46px; object-fit: contain; transform: rotate(8deg); border-radius: {{stickerRadius}};"></sc-if>
                  <div style="font-size: 28px; font-weight: 700;">Dear {{dear}},</div>
                  <div style="margin-top: 34px; white-space: pre-line;">{{note}}</div>
                  <div style="margin-top: 34px; font-size: 27px; font-weight: 700;">— {{sigName}}</div>
                  <div style="font-size: 17px; line-height: 20px; color: #4A4A4A;">{{sigRole}}</div>
                </div>
                </div>
                <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; border-radius: 0 0 6px 6px; background: linear-gradient(175deg, #F3EFE5, #EAE4D6); clip-path: polygon(0 34%, 50% 66%, 100% 34%, 100% 100%, 0 100%);">
                  <svg viewBox="0 0 330 190" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;"><path d="M2 188 L150 118 M328 188 L180 118" fill="none" stroke="#D6CFBC" stroke-width="1.6"/></svg>
                </div>
              </div>
              <button type="button" onClick="{{keep}}" style="margin-top: 22px; min-height: 56px; border-radius: 999px; border: 0; background: {{keepBg}}; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer;">{{keepLabel}}</button>
            </div>
          </sc-if>

        </div>
        <div style="font-size: 14px; color: #5E5B53; line-height: 1.55;">Letters stay in the student's Samaky account. Only they and your office see them.</div>
      </aside>
    </div>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cfg = {"whos": [{"id": "event", "label": "Everyone from the blood drive (28)", "send": "Send 28 letters", "dear": "Ava", "sentMsg": "28 letters are on their way. Each one is addressed by name."}, {"id": "one", "label": "One student", "send": "Send letter", "dear": "Mai", "sentMsg": "Your letter to Mai is on its way."}, {"id": "club", "label": "A club", "send": "Send to club", "dear": "Pre-Health Society", "sentMsg": "Sent to all 56 members of Pre-Health Society."}, {"id": "program", "label": "A program (HEAL)", "send": "Send to HEAL", "dear": "HEAL volunteers", "sentMsg": "Sent to all 42 HEAL members."}], "note": "Thank you for greeting every donor at the campus blood drive. You made St. Thomas proud.", "sig": "Rosa Delgado, Director, Service Learning Office", "accent": "#471C72", "keepColor": "#471C72", "logo": "brand/ust-shield.png", "logoLabel": "St. Thomas shield sticker"};
    this.state = { who: this.cfg.whos[0].id, sticker: 'maky', open: false, kept: false, sent: false, drafted: false };
    this.note = this.cfg.note; this.sig = this.cfg.sig; this.settled = false;
  }
  renderVals() {
    var self = this, cfg = this.cfg, st = this.state;
    var chip = function (on) {
      return 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: ' + cfg.accent + '; color: #FFFFFF; border: 1.5px solid ' + cfg.accent + ';' : 'background: #FFFFFF; color: #1A1A1A; border: 1.5px solid #E0DCCD;');
    };
    var who = cfg.whos.filter(function (w) { return w.id === st.who; })[0];
    var stDefs = [
      { id: 'maky', label: 'Maky sticker', src: 'brand/maky.png' },
      { id: 'logo', label: cfg.logoLabel, src: cfg.logo },
      { id: 'none', label: 'No sticker', src: '' }
    ];
    var sticker = stDefs.filter(function (d) { return d.id === st.sticker; })[0];
    var comma = this.sig.indexOf(',');
    var anim = !this.settled;
    return {
      noSubmit: function (e) { e.preventDefault(); },
      whos: cfg.whos.map(function (w) { return { label: w.label, on: w.id === st.who ? 'true' : 'false', style: chip(w.id === st.who), pick: function () { self.setState({ who: w.id, sent: false }); } }; }),
      stickers: stDefs.map(function (d) {
        var on = d.id === st.sticker;
        return { label: d.label, src: d.src, radius: d.id === 'maky' ? '999px' : '0', img: d.id !== 'none', none: d.id === 'none', on: on ? 'true' : 'false',
          style: 'width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #FAF9F5; ' + (on ? 'border: 2.5px solid ' + cfg.accent + ';' : 'border: 1.5px solid #E0DCCD;'),
          pick: function () { self.setState({ sticker: d.id }); } };
      }),
      note: this.note, sig: this.sig,
      setNote: function (e) { self.note = e.target.value; },
      setSig: function (e) { self.sig = e.target.value; },
      sendLabel: st.sent ? 'Sent' : who.send,
      sent: st.sent, sentMsg: who.sentMsg,
      send: function () { self.setState({ sent: true }); },
      draftLabel: st.drafted ? 'Draft saved' : 'Save draft',
      draft: function () { self.setState({ drafted: true }); },
      closed: !st.open, opened: st.open,
      open: function () { self.settled = false; self.setState({ open: true, kept: false }); setTimeout(function () { self.settled = true; }, 1500); },
      replay: function () { self.setState({ open: false }); },
      flapCls: anim ? 'lt-flap-anim' : '', letterCls: anim ? 'lt-up-anim' : '',
      dear: who.dear,
      hasSticker: sticker.id !== 'none', stickerSrc: sticker.src, stickerRadius: sticker.id === 'maky' ? '999px' : '0',
      sigName: comma > -1 ? this.sig.slice(0, comma).trim() : this.sig.trim(),
      sigRole: comma > -1 ? this.sig.slice(comma + 1).trim() : '',
      keep: function () { self.setState({ kept: true }); },
      keepLabel: st.kept ? 'Saved to My letters ✓' : 'Keep in My letters',
      keepBg: cfg.keepColor
    };
  }
}
</script>
