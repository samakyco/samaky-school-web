<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hours by cause · Samaky for Schools</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#471C72}a:hover{color:#2E1149}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #471C72; color: #FFFFFF; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="index.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="margin: 0 2px 16px; padding: 14px; border-radius: 16px; background: #5B2E88; display: flex; align-items: center; gap: 12px;">
      <img src="brand/ust-shield.png" alt="University of St. Thomas shield" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; border: 0; box-sizing: border-box; background: #FFFFFF; object-fit: contain; display: block;">
      <div style="min-width: 0; line-height: 1.35;"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-weight: 600; font-size: 15px; color: #FAF9F5;">University of St. Thomas</span><span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; border-radius: 999px; padding: 2px 8px; background: #F3E6DC; color: #7A4A21;">Demo</span></div><div style="font-size: 12px; color: #E3D7F0; margin-top: 2px;">Service Learning Office · Fall 2026</div></div>
    </div>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 0 12px 6px;">Overview</div>
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="SchoolCalendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="SchoolEvents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Our events</a>
    <a href="SchoolReports.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; background: #FFFFFF; color: #471C72; font-weight: 700;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Review</div>
    <a href="SchoolApprove.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Approve hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolExpenses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Expenses<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">3</span></a>
    <a href="SchoolReflections.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Reflections<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolTranscripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcripts</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Students and courses</div>
    <a href="SchoolStudents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Students</a>
    <a href="SchoolPrograms.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Programs</a>
    <a href="SchoolCourses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg>Community courses</a>
    <a href="SchoolPartners.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Community partners</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Setup</div>
    <a href="SchoolCanvas.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect Canvas</a>
    <a href="SchoolProfile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Office profile and team</a>
    <a href="SchoolMaky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover; background: #FAF9F5;">Ask Maky</a>
    <div style="height: 8px;"></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <a href="SchoolReports.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; text-decoration: none; align-self: flex-start;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to reports</a>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Hours by cause</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">Where St. Thomas students spent their service time, Jan to Oct 2026. Every hour was verified by a nonprofit.</p>
      </div>
      
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
      <section style="flex: 3 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 24px;">
        <h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">9,412 verified hours</h2>
        <sc-for list="{{causes}}" as="c" hint-placeholder-count="7">
          <div style="padding: 12px 0; border-top: 1px solid #E5E1D3;">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 15px; margin-bottom: 8px;">
              <span style="display: inline-flex; align-items: center; gap: 10px; font-weight: 700;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{c.color}};"></span>{{c.name}}</span>
              <span style="color: #5E5B53;"><span style="font-weight: 700; color: #1A1A1A;">{{c.hrs}}</span> hrs · {{c.students}} students · <span style="color: {{c.trendColor}}; font-weight: 600;">{{c.trend}}</span></span>
            </div>
            <div style="height: 14px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 14px; border-radius: 999px; background: {{c.color}}; width: {{c.pct}};"></div></div>
          </div>
        </sc-for>
        <div style="font-size: 13px; color: #5E5B53; margin-top: 10px;">Change compared with the same months last year.</div>
      </section>
      <aside style="flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Causes students want next</h2>
          <p style="margin: 0 0 6px; font-size: 14px; color: #5E5B53; line-height: 1.5;">From the interests students picked on their Samaky profile.</p>
          <div style="padding: 10px 0; border-top: 1px solid #E5E1D3; display: flex; justify-content: space-between; font-size: 15px;"><span style="font-weight: 700;">Mental health</span><span style="color: #5E5B53;">212 students</span></div>
          <div style="padding: 10px 0; border-top: 1px solid #E5E1D3; display: flex; justify-content: space-between; font-size: 15px;"><span style="font-weight: 700;">Immigrant and refugee support</span><span style="color: #5E5B53;">148 students</span></div>
          <div style="padding: 10px 0; border-top: 1px solid #E5E1D3; display: flex; justify-content: space-between; font-size: 15px;"><span style="font-weight: 700;">Youth sports</span><span style="color: #5E5B53;">121 students</span></div>
          <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5;">Few partners offer these yet. <a href="SchoolPartners.html" style="font-weight: 700;">Find partners</a></p>
        </section>
        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; border: 2px solid #471C72; background: #FFFFFF; color: #471C72;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download PDF</button>
      </aside>
    </div>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var d = [
      ['Health', 2410, 214, '+18%', '#471C72'],
      ['Hunger', 1980, 188, '+9%', '#7B5BA6'],
      ['Education', 1620, 122, '+22%', '#A585C4'],
      ['Seniors', 1204, 141, '+5%', '#C78B7B'],
      ['Housing', 1050, 96, '+11%', '#D4AA72'],
      ['Environment', 742, 102, '-4%', '#7FAA7E'],
      ['Animals', 406, 64, '+2%', '#94B7AE']
    ];
    return { causes: d.map(function (c) { var down = c[3].charAt(0) === '-'; return { name: c[0], hrs: c[1].toLocaleString('en-US'), students: c[2], trend: c[3], trendColor: down ? '#8E3B2E' : '#2F6B3A', color: c[4], pct: Math.round(c[1] / 2410 * 100) + '%' }; }) };
  }
}
</script>

</body>
</html>
