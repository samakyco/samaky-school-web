<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all' };
  }
  renderVals() {
    var self = this;
    var defs = [
      ['Ava Thompson', 'thom4821', 'Nursing', 'NURS 210', 5, 20],
      ['Noah Kim', 'kimn0193', 'Engineering', 'ENGR 120', 8, 20],
      ['Daniel Ortiz', 'orti7310', 'Education', 'EDUC 305', 6, 15],
      ['Mai Vang', 'vang2207', 'Biology', 'BIOL 207', 8, 15],
      ['Lucas Berg', 'berg5519', 'Business', 'BUSN 200', 8, 10],
      ['Sofia Ramirez', 'rami0846', 'Psychology', 'PSYC 310', 5, 10],
      ['Grace Lee', 'leeg4410', 'Nursing', 'NURS 210', 20, 20],
      ['Omar Hassan', 'hass2876', 'Business', 'BUSN 200', 12, 10]
    ];
    var tag = 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; white-space: nowrap; ';
    var rows = defs.map(function (d) {
      var ratio = d[4] / d[5];
      var k = ratio >= 1 ? 'done' : (ratio >= 0.5 ? 'track' : 'behind');
      return {
        name: d[0], email: d[1] + '@stthomas.edu', major: d[2], course: d[3], hrs: d[4], goal: d[5], k: k,
        pct: Math.min(100, Math.round(ratio * 100)) + '%',
        status: k === 'done' ? 'Done' : (k === 'track' ? 'On track' : 'Behind'),
        tagStyle: tag + (k === 'done' ? 'background: #F9F6FC; color: #471C72; border: 1px solid #471C72;' : (k === 'track' ? 'background: #E5E1D3; color: #1A1A1A;' : 'background: #F3E6DC; color: #7A4A21;'))
      };
    });
    var f = this.state.f;
    var fs = [['all', 'All'], ['behind', 'Behind'], ['track', 'On track'], ['done', 'Done']];
    var base = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
    return {
      rows: rows.filter(function (r) { return f === 'all' || r.k === f; }),
      filters: fs.map(function (x) {
        var on = x[0] === f;
        return { label: x[1], on: on ? 'true' : 'false', style: base + (on ? 'border: 1.5px solid #471C72; background: #471C72; color: #FFFFFF;' : 'border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A;'), pick: function () { self.setState({ f: x[0] }); } };
      })
    };
  }
}
</script>
