      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Community courses</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">49 service-learning courses run through Samaky this term. Each one links students to partners that fit the course.</p>
      </div>
      <a href="SchoolCanvas.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; border: 0; background: #471C72; color: #FFFFFF; min-height: 52px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add a course</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px;">
      <sc-for list="{{courses}}" as="c" hint-placeholder-count="6">
        <article style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.6px; color: #471C72;">{{c.code}}</span>
            <span style="font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: #E5E1D3;">Linked from Canvas</span>
          </div>
          <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.15;">{{c.title}}</div>
          <div style="font-size: 14px; color: #5E5B53;">{{c.teacher}} · {{c.students}} students · {{c.partners}} partners</div>
          <div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px;"><span><span style="font-weight: 700;">{{c.done}}</span> on pace</span><span style="color: #5E5B53;">of {{c.students}}</span></div>
            <div style="height: 10px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 10px; border-radius: 999px; background: #471C72; width: {{c.pct}};"></div></div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 6px; border-top: 1px solid #E5E1D3; font-size: 14px;">
            <span>Hours due <span style="font-weight: 700;">{{c.due}}</span></span>
            <a href="SchoolStudents.html" style="font-weight: 700;">Students</a>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var d = [
      ['NURS 210', 'Community Health', 'Prof. R. Alvarez', 64, 3, 41, 'Nov 6'],
      ['BUSN 200', 'Business for Good', 'Prof. K. Nguyen', 85, 5, 72, 'Dec 4'],
      ['ENGR 120', 'Design for Community', 'Prof. T. Okafor', 52, 2, 24, 'Dec 4'],
      ['BIOL 207', 'Food Systems', 'Prof. L. Brandt', 41, 2, 33, 'Dec 4'],
      ['EDUC 305', 'Literacy in Schools', 'Prof. M. Sato', 28, 1, 22, 'Nov 20'],
      ['PSYC 310', 'Aging and Society', 'Prof. J. Moreau', 33, 2, 25, 'Dec 4']
    ];
    return { courses: d.map(function (c) { return { code: c[0], title: c[1], teacher: c[2], students: c[3], partners: c[4], done: c[5], due: c[6], pct: Math.round(c[5] / c[3] * 100) + '%' }; }) };
  }
}
</script>
