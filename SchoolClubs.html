        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 660px;">Student clubs that volunteer together on Samaky. See which nonprofits each club partners with, and help clubs that are still looking for one.</p>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px;">
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Clubs serving</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #471C72; margin-top: 6px;">14</div></div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Members who served</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; margin-top: 6px;">386</div></div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Club hours this term</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; margin-top: 6px;">1,912</div></div>
    </div>

    <section style="background: #F9F6FC; border: 1.5px solid #471C72; border-radius: 24px; padding: 22px 24px;">
      <h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Looking for a partner ({{needCount}})</h2>
      <p style="margin: 0 0 6px; font-size: 14px; color: #5E5B53;">These clubs have to do service this term but don't have a nonprofit yet.</p>
      <sc-for list="{{needs}}" as="n" hint-placeholder-count="2">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 0; border-top: 1px solid #E3D9EE;">
          <div style="flex: 1 1 260px; min-width: 0;"><div style="font-weight: 700; font-size: 16px;">{{n.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{n.sub}}</div></div>
          <span style="{{n.tagStyle}}">{{n.tag}}</span>
          <button type="button" onClick="{{n.act}}" disabled="{{n.done}}" style="{{n.btnStyle}}">{{n.btn}}</button>
        </div>
      </sc-for>
    </section>

    <div role="group" aria-label="Filter clubs by cause" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px;">
      <sc-for list="{{clubs}}" as="c" hint-placeholder-count="6">
        <article style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div aria-hidden="true" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 14px; background: {{c.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">{{c.ini}}</div>
            <div style="min-width: 0;"><div style="font-weight: 700; font-size: 17px;">{{c.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{c.members}} members · Led by {{c.lead}}</div></div>
          </div>
          <div style="font-size: 14px; line-height: 1.5;"><span style="color: #5E5B53;">Partners with</span> <span style="font-weight: 700;">{{c.partner}}</span></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; border-top: 1px solid #E5E1D3; padding-top: 12px;">
            <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #471C72;">{{c.hrs}}</div><div style="font-size: 13px; color: #5E5B53;">hours this term</div></div>
            <div><div style="font-weight: 700; font-size: 14px; margin-top: 4px;">{{c.next}}</div><div style="font-size: 13px; color: #5E5B53;">next shift</div></div>
          </div>
          <button type="button" onClick="{{c.msg}}" style="{{c.btnStyle}}">{{c.btn}}</button>
        </article>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; color: #5E5B53;">Clubs don't verify hours. The nonprofit does, and your office approves them for credit. You only see member counts, never private chats.</p>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all', msg: {}, helped: {} }; }
  renderVals() {
    var self = this, st = this.state;
    var data = [
      { id: 'phs', ini: 'PH', bg: '#A8577E', name: 'Pre-Health Society', members: 56, lead: 'Grace L.', partner: 'North Star Blood Center', cause: 'health', hrs: '410', next: 'Thu, Nov 12' },
      { id: 'ts', ini: 'TS', bg: '#471C72', name: 'Tommies Serve', members: 42, lead: 'Sophea K.', partner: 'Eastside Senior Commons', cause: 'seniors', hrs: '318', next: 'Sat, Nov 7' },
      { id: 'bfg', ini: 'BG', bg: '#8E5A3B', name: 'Business for Good', members: 35, lead: 'Omar H.', partner: 'Northside Food Shelf', cause: 'hunger', hrs: '276', next: 'Sat, Nov 21' },
      { id: 'efc', ini: 'EC', bg: '#3F7E44', name: 'Engineers for Community', members: 28, lead: 'Noah K.', partner: 'Green Corridor Cleanup', cause: 'environment', hrs: '204', next: 'Sun, Nov 15' },
      { id: 'edu', ini: 'ED', bg: '#7B5BA6', name: 'Future Teachers Club', members: 22, lead: 'Elena V.', partner: 'Riverbend Literacy Project', cause: 'education', hrs: '188', next: 'Wed, Nov 4' },
      { id: 'psy', ini: 'PS', bg: '#C78B7B', name: 'Psychology Club', members: 30, lead: 'Sofia R.', partner: 'Lakeview Animal Rescue', cause: 'animals', hrs: '142', next: 'Sat, Nov 14' }
    ];
    var fs = [['all', 'All'], ['health', 'Health'], ['hunger', 'Hunger'], ['education', 'Education'], ['seniors', 'Seniors'], ['environment', 'Environment']];
    var b = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
    var needDefs = [
      { id: 'ult', name: 'Ultimate Frisbee Club', sub: '24 members · wants a weekend outdoor project' },
      { id: 'aasa', name: 'Asian American Student Association', sub: '61 members · interested in youth mentoring' }
    ];
    var tag = 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; ';
    var needs = needDefs.map(function (n) {
      var done = !!st.helped[n.id];
      return { name: n.name, sub: n.sub, done: done, tag: done ? 'Partner suggested' : 'Needs a partner',
        tagStyle: tag + (done ? 'background: #FFFFFF; color: #471C72; border: 1px solid #471C72;' : 'background: #F3E6DC; color: #7A4A21;'),
        btn: done ? 'Sent to club leader' : 'Suggest a partner',
        btnStyle: b + (done ? 'border: 0; background: #E5E1D3; color: #5E5B53; cursor: default;' : 'border: 0; background: #471C72; color: #FFFFFF;'),
        act: function () { var h = Object.assign({}, self.state.helped); h[n.id] = true; self.setState({ helped: h }); } };
    });
    return {
      needs: needs, needCount: needs.filter(function (n) { return !n.done; }).length,
      filters: fs.map(function (x) { var on = x[0] === st.f; return { label: x[1], on: on ? 'true' : 'false', style: b + (on ? 'border: 1.5px solid #471C72; background: #471C72; color: #FFFFFF;' : 'border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A;'), pick: function () { self.setState({ f: x[0] }); } }; }),
      clubs: data.filter(function (c) { return st.f === 'all' || c.cause === st.f; }).map(function (c) {
        var sent = !!st.msg[c.id];
        return Object.assign({}, c, { btn: sent ? 'Message sent' : 'Message club leader',
          btnStyle: b + 'align-self: flex-start; ' + (sent ? 'border: 1.5px solid #471C72; background: #F9F6FC; color: #471C72;' : 'border: 1.5px solid #471C72; background: #FFFFFF; color: #471C72;'),
          msg: function () { var m = Object.assign({}, self.state.msg); m[c.id] = true; self.setState({ msg: m }); } });
      })
    };
  }
}
</script>
