<body>

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

    <a href="SchoolCampaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges</a>
    <a href="SchoolChallenge.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Review</div>
    <a href="SchoolApprove.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Approve hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolExpenses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Expenses<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">3</span></a>
    <a href="SchoolReflections.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Reflections<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolTranscripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcripts</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Students and courses</div>
    <a href="SchoolStudents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Students</a>
    <a href="SchoolPrograms.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Programs</a>
    <a href="SchoolCourses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg>Courses</a>
    <a href="SchoolPartners.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Partners</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Setup</div>
    <a href="SchoolCanvas.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect Canvas</a>
    <a href="SchoolProfile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Office and team</a>
    </div>
    <a href="SchoolMaky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover; background: #FAF9F5;">Ask Maky</a>
    <div style="height: 8px;"></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Clubs</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 660px;">Every club that has to serve this term, in one place. See where each club is in its requirement, who is waiting on whom, and help clubs that are still looking for a partner.</p>
      </div>
    </div>

    <section aria-label="Fall service requirement" style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;">
        <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Fall service requirement</h2>
        <span style="font-size: 14px; font-weight: 700; color: #7A4A21; background: #F3E6DC; border-radius: 999px; padding: 6px 14px;">Due Fri, Dec 4 · {{daysLeft}} days left</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px;">
        <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1.1;">{{totalReq}}</div><div style="font-size: 14px; color: #5E5B53;">clubs required to serve</div></div>
        <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1.1; color: #471C72;">{{metCount}}</div><div style="font-size: 14px; color: #5E5B53;">requirement met</div></div>
        <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1.1;">{{officeCount}}</div><div style="font-size: 14px; color: #5E5B53;">waiting on your office</div></div>
        <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1.1; color: #7A4A21;">{{attnCount}}</div><div style="font-size: 14px; color: #5E5B53;">need attention, incl. {{needCount}} with no partner</div></div>
      </div>
      <div>
        <div role="img" aria-label="{{metCount}} of {{totalReq}} clubs have met the requirement" style="display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #E5E1D3;">
          <div style="width: {{metPct}}%; background: #471C72;"></div>
          <div style="width: {{officePct}}%; background: #B79FD1;"></div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: #5E5B53;">
          <span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #471C72; margin-right: 6px;"></span>Met</span>
          <span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #B79FD1; margin-right: 6px;"></span>Waiting on your office</span>
          <span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #E5E1D3; margin-right: 6px;"></span>Still in progress or no partner</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5E5B53;">Each club moves through four steps: <b style="color: #1A1A1A;">Partner found</b> → <b style="color: #1A1A1A;">Served</b> → <b style="color: #1A1A1A;">Reflection in</b> → <b style="color: #1A1A1A;">Approved</b>. Steps fill in on their own as the nonprofit verifies hours and the club leader submits the reflection.</p>
    </section>

    <section style="background: #F9F6FC; border: 1.5px solid #471C72; border-radius: 24px; padding: 22px 24px;">
      <h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Looking for a partner ({{needCount}})</h2>
      <p style="margin: 0 0 6px; font-size: 14px; color: #5E5B53;">These clubs have to do service this term but don't have a nonprofit yet.</p>
      <sc-for list="{{needs}}" as="n" hint-placeholder-count="2">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 0; border-top: 1px solid #E3D9EE;">
          <div style="flex: 1 1 260px; min-width: 0;"><div style="font-weight: 700; font-size: 16px;">{{n.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{n.sub}}</div></div>
          <span style="{{n.tagStyle}}">{{n.tag}}</span>
          <button type="button" onClick="{{n.act}}" disabled="{{n.done}}" style="{{n.btnStyle}}">{{n.btn}}</button>
        </div>
      </sc-for>
    </section>

    <div role="group" aria-label="Filter clubs by status" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{statusFilters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div role="group" aria-label="Filter clubs by cause" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: -12px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px;">
      <sc-for list="{{clubs}}" as="c" hint-placeholder-count="6">
        <article style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div aria-hidden="true" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 14px; background: {{c.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">{{c.ini}}</div>
            <div style="min-width: 0;"><div style="font-weight: 700; font-size: 17px;">{{c.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{c.members}} members · Led by {{c.lead}}</div></div>
          </div>
          <div style="font-size: 14px; line-height: 1.5;"><span style="color: #5E5B53;">Partners with</span> <span style="font-weight: 700;">{{c.partner}}</span><sc-if value="{{c.returning}}"><br><span style="font-size: 13px; color: #471C72; font-weight: 600;">{{c.returning}}</span></sc-if></div>
          <div style="border-top: 1px solid #E5E1D3; padding-top: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
              <span style="{{c.tagStyle}}">{{c.stageLabel}}</span>
              <span style="font-size: 13px; color: #5E5B53;">Step {{c.stage}} of 4</span>
            </div>
            <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px;">
              <sc-for list="{{c.segs}}" as="s" hint-placeholder-count="4"><div style="height: 6px; border-radius: 999px; background: {{s}};"></div></sc-for>
            </div>
            <div style="font-size: 14px; line-height: 1.45; margin-top: 10px;"><span style="color: #5E5B53;">Next step:</span> {{c.nextStep}}</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; border-top: 1px solid #E5E1D3; padding-top: 12px;">
            <div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: #471C72;">{{c.hrs}}</div><div style="font-size: 13px; color: #5E5B53;">verified hours</div></div>
            <div><div style="font-weight: 700; font-size: 14px; margin-top: 4px;">{{c.next}}</div><div style="font-size: 13px; color: #5E5B53;">{{c.nextLabel}}</div></div>
          </div>
          <sc-if value="{{c.hasLink}}"><a href="{{c.href}}" style="{{c.btnStyle}} display: inline-flex; align-items: center; text-decoration: none;">{{c.btn}}</a></sc-if>
          <sc-if value="{{c.noLink}}"><button type="button" onClick="{{c.act}}" disabled="{{c.sent}}" style="{{c.btnStyle}}">{{c.btn}}</button></sc-if>
        </article>
      </sc-for>
    </div>
    <sc-if value="{{noClubs}}"><p style="margin: 0; font-size: 15px; color: #5E5B53;">No clubs match these filters.</p></sc-if>
    <p style="margin: 0; font-size: 14px; color: #5E5B53;">Clubs don't verify hours. The nonprofit does, and your office approves them for credit. Club leaders see their own club's status, not other clubs'. You only see member counts, never private chats.</p>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all', sf: 'all', act: {}, helped: {} }; }
  renderVals() {
    var self = this, st = this.state;
    // stage: 1 Partner found, 2 Served, 3 Reflection in (waiting on office), 4 Approved
    var data = [
      { id: 'phs', ini: 'PH', bg: '#A8577E', name: 'Pre-Health Society', members: 56, lead: 'Grace L.', partner: 'North Star Blood Center', cause: 'health', hrs: '410', stage: 4, returning: 'Returning partner · 3rd semester together', next: 'Thu, Dec 10', nextLabel: 'next shift' },
      { id: 'psy', ini: 'PS', bg: '#C78B7B', name: 'Psychology Club', members: 30, lead: 'Sofia R.', partner: 'Lakeview Animal Rescue', cause: 'animals', hrs: '142', stage: 4, returning: '', next: 'None yet', nextLabel: 'next shift' },
      { id: 'ts', ini: 'TS', bg: '#471C72', name: 'Tommies Serve', members: 42, lead: 'Sophea K.', partner: 'Eastside Senior Commons', cause: 'seniors', hrs: '318', stage: 3, returning: 'Returning partner · 2nd semester together', next: 'Nov 20', nextLabel: 'reflection submitted' },
      { id: 'pot', ini: 'OT', bg: '#4F7CAC', name: 'Pre-OT Club', members: 19, lead: 'Ava T.', partner: 'Northside Food Shelf', cause: 'hunger', hrs: '57', stage: 3, returning: '', next: 'Nov 23', nextLabel: 'reflection submitted' },
      { id: 'bfg', ini: 'BG', bg: '#8E5A3B', name: 'Business for Good', members: 35, lead: 'Omar H.', partner: 'Northside Food Shelf', cause: 'hunger', hrs: '96', stage: 2, returning: '', next: 'Nov 7', nextLabel: 'served' },
      { id: 'chem', ini: 'CH', bg: '#5E8C61', name: 'Chemistry Club', members: 18, lead: 'Lina P.', partner: 'Green Corridor Cleanup', cause: 'environment', hrs: '36', stage: 2, returning: '', next: 'Nov 14', nextLabel: 'served' },
      { id: 'efc', ini: 'EC', bg: '#3F7E44', name: 'Engineers for Community', members: 28, lead: 'Noah K.', partner: 'Green Corridor Cleanup', cause: 'environment', hrs: '0', stage: 1, returning: '', next: 'Sat, Nov 28', nextLabel: 'first shift' },
      { id: 'edu', ini: 'ED', bg: '#7B5BA6', name: 'Future Teachers Club', members: 22, lead: 'Elena V.', partner: 'Riverbend Literacy Project', cause: 'education', hrs: '0', stage: 1, returning: '', next: 'Not booked', nextLabel: 'first shift' }
    ];
    var needDefs = [
      { id: 'ult', name: 'Ultimate Frisbee Club', sub: '24 members · wants a weekend outdoor project' },
      { id: 'aasa', name: 'Asian American Student Association', sub: '61 members · interested in youth mentoring' }
    ];
    var labels = ['', 'Partner found', 'Served', 'Waiting on your office', 'Requirement met'];
    var tag = 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; ';
    var tagStyles = ['', tag + 'background: #F3E6DC; color: #7A4A21;', tag + 'background: #F3E6DC; color: #7A4A21;', tag + 'background: #F9F6FC; color: #471C72; border: 1px solid #B79FD1;', tag + 'background: #471C72; color: #FFFFFF;'];
    var b = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-sizing: border-box; ';
    var outline = b + 'align-self: flex-start; border: 1.5px solid #471C72; background: #FFFFFF; color: #471C72;';
    var solid = b + 'align-self: flex-start; border: 1.5px solid #471C72; background: #471C72; color: #FFFFFF;';
    var doneBtn = b + 'align-self: flex-start; border: 1.5px solid #E5E1D3; background: #E5E1D3; color: #5E5B53; cursor: default;';
    var nextSteps = {
      1: function (c) { return c.next === 'Not booked' ? 'The club hasn\'t booked a shift yet. Nudge ' + c.lead + ' before the deadline.' : 'First shift is booked. Hours appear once ' + c.partner + ' verifies them.'; },
      2: function (c) { return 'Hours are verified. Waiting on the club reflection from ' + c.lead.replace(/\.$/, '') + '.'; },
      3: function (c) { return 'Reflection is in. Review it and approve the club\'s hours.'; },
      4: function (c) { return 'Done for this term. Hours are on members\' transcripts.'; }
    };
    var needs = needDefs.map(function (n) {
      var done = !!st.helped[n.id];
      return { name: n.name, sub: n.sub, done: done, tag: done ? 'Partner suggested' : 'Needs a partner',
        tagStyle: tag + (done ? 'background: #FFFFFF; color: #471C72; border: 1px solid #471C72;' : 'background: #F3E6DC; color: #7A4A21;'),
        btn: done ? 'Sent to club leader' : 'Suggest a partner',
        btnStyle: b + (done ? 'border: 0; background: #E5E1D3; color: #5E5B53; cursor: default;' : 'border: 0; background: #471C72; color: #FFFFFF;'),
        act: function () { var h = Object.assign({}, self.state.helped); h[n.id] = true; self.setState({ helped: h }); } };
    });
    var noPartner = needs.filter(function (n) { return !n.done; }).length;
    var total = data.length + needDefs.length;
    var met = data.filter(function (c) { return c.stage === 4; }).length;
    var office = data.filter(function (c) { return c.stage === 3; }).length;
    var attn = data.filter(function (c) { return c.stage <= 2; }).length + needDefs.length;
    var match = function (c) {
      if (st.sf === 'attn' && c.stage > 2) return false;
      if (st.sf === 'office' && c.stage !== 3) return false;
      if (st.sf === 'met' && c.stage !== 4) return false;
      return st.f === 'all' || c.cause === st.f;
    };
    var chip = function (on) { return b + (on ? 'border: 1.5px solid #471C72; background: #471C72; color: #FFFFFF;' : 'border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A;'); };
    var sfs = [['all', 'All clubs · ' + data.length], ['attn', 'Need attention · ' + (attn - needDefs.length)], ['office', 'Waiting on your office · ' + office], ['met', 'Requirement met · ' + met]];
    var fs = [['all', 'All causes'], ['health', 'Health'], ['hunger', 'Hunger'], ['education', 'Education'], ['seniors', 'Seniors'], ['environment', 'Environment']];
    var clubs = data.filter(match).map(function (c) {
      var sent = !!st.act[c.id];
      var segs = [1, 2, 3, 4].map(function (i) { return i <= c.stage ? '#471C72' : '#E5E1D3'; });
      var o = { segs: segs, stageLabel: labels[c.stage], tagStyle: tagStyles[c.stage], nextStep: nextSteps[c.stage](c), sent: sent, hasLink: false, noLink: true };
      if (c.stage === 3) { o.hasLink = true; o.noLink = false; o.href = 'SchoolApprove.html'; o.btn = 'Review and approve'; o.btnStyle = solid; }
      else if (c.stage === 4) { o.hasLink = true; o.noLink = false; o.href = 'SchoolTranscripts.html'; o.btn = 'See transcripts'; o.btnStyle = outline; }
      else {
        var verb = c.stage === 2 ? 'Remind about reflection' : 'Message club leader';
        o.btn = sent ? (c.stage === 2 ? 'Maky sent a reminder' : 'Message sent') : verb;
        o.btnStyle = sent ? doneBtn : outline;
        o.act = function () { var a = Object.assign({}, self.state.act); a[c.id] = true; self.setState({ act: a }); };
      }
      return Object.assign({}, c, o);
    });
    return {
      daysLeft: 8,
      totalReq: total, metCount: met, officeCount: office, attnCount: attn,
      metPct: Math.round(met / total * 100), officePct: Math.round(office / total * 100),
      needs: needs, needCount: noPartner,
      statusFilters: sfs.map(function (x) { var on = x[0] === st.sf; return { label: x[1], on: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ sf: x[0] }); } }; }),
      filters: fs.map(function (x) { var on = x[0] === st.f; return { label: x[1], on: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ f: x[0] }); } }; }),
      clubs: clubs, noClubs: clubs.length === 0
    };
  }
}
</script>
