<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { name: 'GivingTuesday Week', kind: 'hours', goal: 1000, launched: false }; }
  renderVals() {
    var self = this;
    var ks = [['hours', 'Hours served', 'hours'], ['students', 'Students taking part', 'students'], ['shifts', 'Shifts completed', 'shifts']];
    var kind = this.state.kind;
    var unit = ks.filter(function (k) { return k[0] === kind; })[0][2];
    var b = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
    var L = 'display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; ';
    var on = this.state.launched;
    return {
      name: this.state.name, goal: this.state.goal, unit: unit, launched: on,
      setName: function (e) { self.setState({ name: e.target.value }); },
      setGoal: function (e) { self.setState({ goal: e.target.value }); },
      kinds: ks.map(function (k) { var sel = k[0] === kind; return { label: k[1], on: sel ? 'true' : 'false',
        style: b + (sel ? 'border: 1.5px solid #471C72; background: #471C72; color: #FFFFFF;' : 'border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A;'),
        pick: function () { self.setState({ kind: k[0] }); } }; }),
      launchLabel: on ? 'Launched' : 'Launch challenge',
      launchStyle: L + (on ? 'border: 2px solid #471C72; background: #F9F6FC; color: #471C72;' : 'border: 0; background: #471C72; color: #FFFFFF;'),
      launch: function () { self.setState({ launched: !self.state.launched }); }
    };
  }
}
</script>
