<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var now = [['Jan', 420], ['Feb', 610], ['Mar', 880], ['Apr', 1120], ['May', 540], ['Jun', 180], ['Jul', 150], ['Aug', 390], ['Sep', 2140], ['Oct', 2982]];
    var last = [360, 520, 700, 940, 470, 160, 120, 300, 1745, 2340];
    var max = 2982;
    return { months: now.map(function (m, i) { return { label: m[0], v: m[1].toLocaleString('en-US'), h: Math.max(3, Math.round(m[1] / max * 200)) + 'px', hLast: Math.max(3, Math.round(last[i] / max * 200)) + 'px' }; }) };
  }
}
</script>
