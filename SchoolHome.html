    <a href="SchoolExpenses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Expenses<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">3</span></a>
    <a href="SchoolReflections.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Reflections<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolTranscripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcripts</a>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <label for="q" style="position: absolute; left: -9999px;">Search</label>
      <input id="q" type="search" placeholder="Search students, courses or partners" style="flex: 1 1 280px; min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 999px; padding: 0 20px; font: inherit; font-size: 15px; background: #FFFFFF; color: #1A1A1A;">
      <button type="button" aria-label="Notifications" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #1A1A1A; color: #FAF9F5; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg></button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -1px;">Good morning, Tommie</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53;">University of St. Thomas · Hours from Jan to Oct 2026</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; border: 2px solid #471C72; background: #FFFFFF; color: #471C72;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <label for="major" style="position: absolute; left: -9999px;">Filter by major</label>
      <select id="major" value="{{major}}" onChange="{{pickMajor}}" style="flex: 0 1 380px; min-height: 52px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 16px; padding: 0 16px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1A1A1A; cursor: pointer;">
        <option value="all">All majors</option>
        <option value="nursing">Nursing</option>
        <option value="business">Business</option>
        <option value="education">Education</option>
        <option value="biology">Biology</option>
        <option value="psychology">Psychology</option>
        <option value="engineering">Engineering</option>
      </select>
      <span style="font-size: 14px; color: #5E5B53;">Showing {{showing}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;">
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px;">
        <div style="font-weight: 700; font-size: 15px;">Students on Samaky</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto;">{{s.students}}</div>
        <div style="font-size: 14px; color: #5E5B53;">Profiles linked to this school</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px;">
        <div style="font-weight: 700; font-size: 15px;">Verified service hours</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto; color: #471C72;">{{s.hours}}</div>
        <div style="font-size: 14px; color: #5E5B53;">Confirmed by a partner since launch</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px;">
        <div style="font-weight: 700; font-size: 15px;">Community courses</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto;">{{s.courses}}</div>
        <div style="font-size: 14px; color: #5E5B53;">Service-learning courses run through Samaky</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px;">
        <div style="font-weight: 700; font-size: 15px;">Community partners</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto;">{{s.partners}}</div>
        <div style="font-size: 14px; color: #5E5B53;">Nonprofits where students served</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;">
      <a href="SchoolApprove.html" style="background: #F9F6FC; border: 1.5px solid #471C72; border-radius: 24px; padding: 22px; display: flex; align-items: center; gap: 16px; text-decoration: none; color: #1A1A1A;">
        <span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; color: #471C72; line-height: 1;">6</span>
        <span style="flex: 1 1 auto;"><span style="display: block; font-weight: 700; font-size: 16px;">Hours waiting for your approval</span><span style="display: block; font-size: 14px; color: #5E5B53; margin-top: 2px;">Already verified by the nonprofit</span></span>
        <span style="font-weight: 700; font-size: 14px; color: #471C72;">Review</span>
      </a>
      <a href="SchoolExpenses.html" style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px; display: flex; align-items: center; gap: 16px; text-decoration: none; color: #1A1A1A;">
        <span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1;">3</span>
        <span style="flex: 1 1 auto;"><span style="display: block; font-weight: 700; font-size: 16px;">Expense requests to review</span><span style="display: block; font-size: 14px; color: #5E5B53; margin-top: 2px;">$52.77 in mileage and rideshare</span></span>
        <span style="font-weight: 700; font-size: 14px; color: #471C72;">Review</span>
      </a>
    </div>

    <section style="border-top: 1px solid #E0DCCD; padding-top: 24px;">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 18px; margin-bottom: 16px;">
        <div>
          <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Quick access menu</h2>
          <p style="margin: 4px 0 0; font-size: 15px; color: #5E5B53;">{{quickHint}}</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
          <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{resetQuick}}" style="min-height: 44px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #471C72; text-decoration: underline; cursor: pointer;">Reset to default</button>
          </sc-if>
          <button type="button" onClick="{{toggleEdit}}" aria-pressed="{{editingStr}}" style="{{editBtnStyle}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{editIcon}}"/></svg>{{editLabel}}</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px;">
