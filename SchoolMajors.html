<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sort: 'students' }; }
  renderVals() {
    var self = this;
    var d = [['Nursing', 182, 2964, 58], ['Business', 164, 2118, 81], ['Education', 121, 2402, 86], ['Biology', 98, 1560, 74], ['Psychology', 87, 1377, 77], ['Engineering', 60, 820, 49]];
    var key = { students: 1, hours: 2, pace: 3 }[this.state.sort];
    var rows = d.slice().sort(function (a, b) { return b[key] - a[key]; }).map(function (m) {
      var low = m[3] < 60;
      return { name: m[0], n: m[1], hrs: m[2].toLocaleString('en-US'), per: (m[2] / m[1]).toFixed(1), pace: m[3] + '%',
        flag: low ? 'Behind' : (m[3] >= 80 ? 'Ahead' : 'On track'), flagColor: low ? '#8E3B2E' : '#471C72', barColor: low ? '#B97F5B' : '#471C72' };
    });
    var opts = [['students', 'Most students'], ['hours', 'Most hours'], ['pace', 'Most on pace']];
    return { rows: rows, sorts: opts.map(function (o) { var on = o[0] === self.state.sort; return { label: o[1], on: on ? 'true' : 'false',
      style: 'min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; cursor: pointer; color: #1A1A1A; ' + (on ? 'background: #FFFFFF; font-weight: 700;' : 'background: transparent; font-weight: 500;'),
      pick: function () { self.setState({ sort: o[0] }); } }; }) };
  }
}
</script>
