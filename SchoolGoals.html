      </div>
      
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px;">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="7">
        <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 20px; display: flex; gap: 16px; align-items: center;">

          <div style="flex: 1 1 auto; min-width: 0;">
            <div style="font-weight: 700; font-size: 16px;">{{g.name}}</div>
            <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #5E5B53; margin: 4px 0 6px;"><span>{{g.hrs}} hours</span><span>{{g.share}}</span></div>
            <div style="height: 8px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 8px; border-radius: 999px; background: #471C72; width: {{g.pct}};"></div></div>
          </div>
        </div>
      </sc-for>
    </div>
    <section style="background: #F9F6FC; border: 1.5px solid #471C72; border-radius: 24px; padding: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">

    </section>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var d = [
      [3, 'Good Health and Well-being', 2410, '#4C9F38', '#FFFFFF'],
      [2, 'Zero Hunger', 1980, '#DDA63A', '#1A1A1A'],
      [4, 'Quality Education', 1620, '#C5192D', '#FFFFFF'],
      [11, 'Sustainable Cities and Communities', 1204, '#FD9D24', '#1A1A1A'],
      [10, 'Reduced Inequalities', 1050, '#DD1367', '#FFFFFF'],
      [13, 'Climate Action', 742, '#3F7E44', '#FFFFFF'],
      [15, 'Life on Land', 406, '#56C02B', '#1A1A1A']
    ];
    var total = 9412;
    return { goals: d.map(function (g) { return { n: g[0], name: g[1], hrs: g[2].toLocaleString('en-US'), bg: g[3], fg: g[4],
      share: Math.round(g[2] / total * 100) + '% of hours', pct: Math.round(g[2] / 2410 * 100) + '%' }; }) };
  }
}
</script>
