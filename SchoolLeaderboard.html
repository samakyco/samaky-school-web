<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'students' }; }
  renderVals() {
    var self = this;
    var data = {
      students: [['Grace Lee', 'Nursing · HEAL', 64], ['Omar Hassan', 'Business', 58], ['Elena Vu', 'Education · Community Tutors', 52], ['Jordan Price', 'Public Health · HEAL', 47], ['Lucas Berg', 'Business · Service Days', 41], ['Mai Vang', 'Biology · HEAL', 38], ['Daniel Ortiz', 'Education', 33], ['Ava Thompson', 'Nursing · HEAL', 29]],
      majors: [['Nursing', '231 students', 2964], ['Education', '158 students', 2402], ['Business', '204 students', 2118], ['Biology', '126 students', 1560], ['Psychology', '112 students', 1377], ['Engineering', '81 students', 820]],
      programs: [['Service Days', '310 members', 1240], ['HEAL', '42 members', 612], ['Community Tutors', '26 members', 498]]
    };
    var tab = this.state.tab;
    var medal = { 1: '#D4B95E', 2: '#D0CCC4', 3: '#C9956B' };
    var rows = data[tab].map(function (r, i) {
      var n = i + 1;
      return { rank: n, name: r[0], sub: r[1], v: r[2].toLocaleString('en-US'), line: i === 0 ? '0' : '1px solid #E5E1D3',
        rankStyle: 'width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #1A1A1A; background: ' + (medal[n] || '#F9F6FC') + ';' };
    });
    var ts = [['students', 'Students'], ['majors', 'Majors'], ['programs', 'Programs']];
    return { rows: rows, tabs: ts.map(function (t) { var on = t[0] === tab; return { label: t[1], on: on ? 'true' : 'false',
      style: 'min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; cursor: pointer; color: #1A1A1A; ' + (on ? 'background: #FFFFFF; font-weight: 700;' : 'background: transparent; font-weight: 500;'),
      pick: function () { self.setState({ tab: t[0] }); } }; }) };
  }
}
</script>
