<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'open', st: {} };
  }
  renderVals() {
    var self = this;
    var q1 = 'What surprised you, and how does it connect to your class?';
    var q2 = 'Who did you meet, and what did you learn from them?';
    var defs = [
      { id: 'a', name: 'Ava Thompson', course: 'NURS 210', service: 'Blood drive greeter', date: 'Oct 3', prompt: q1, text: 'I did not expect first-time donors to be so nervous. Walking them through each step felt a lot like the patient teaching we practiced in week 4. Next time I want to ask the nurses how they calm people down.' },
      { id: 'b', name: 'Noah Kim', course: 'ENGR 120', service: 'Tech help Tuesdays', date: 'Oct 6', prompt: q2, text: 'I met a resident who wanted to video call her grandson, but the app kept changing after every update. It made our design unit real for me: if a button keeps moving, people stop trusting it.' },
      { id: 'c', name: 'Mai Vang', course: 'BIOL 207', service: 'Pack meals for families', date: 'Oct 10', prompt: q1, text: 'We packed about 1,200 meals in two hours. The coordinator said most families who come in are working but still come up short. That changed how I think about who uses a food shelf.' },
      { id: 'd', name: 'Daniel Ortiz', course: 'EDUC 305', service: 'Reading buddies', date: 'Oct 14', prompt: q1, text: 'My reading buddy only wanted to read about sharks, so we did, and he read two full pages without stopping. Letting kids choose matters more than I thought.' },
      { id: 'e', name: 'Sofia Ramirez', course: 'PSYC 310', service: 'Dog walking crew', date: 'Oct 17', prompt: q2, text: 'It was a good shift. The dogs were fun.' },
      { id: 'f', name: 'Lucas Berg', course: 'BUSN 200', service: 'River cleanup', date: 'Oct 18', prompt: q1, text: 'We filled 30 bags from one stretch of river, and most of it was packaging. I want to look at which local companies could change their packaging for our class project.' }
    ];
    var st = this.state.st; var tab = this.state.tab;
    var set = function (id, v) { var s = Object.assign({}, self.state.st); if (v) { s[id] = v; } else { delete s[id]; } self.setState({ st: s }); };
    var tag = 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; ';
    var openN = defs.filter(function (d) { return !st[d.id]; }).length;
    var rows = defs.filter(function (d) { return tab === 'all' || (tab === 'open' ? !st[d.id] : !!st[d.id]); }).map(function (d) {
      var s = st[d.id];
      return Object.assign({}, d, { open: !s, done: !!s,
        tag: s === 'meets' ? 'Meets expectations' : (s === 'more' ? 'Asked for more' : 'New'),
        tagStyle: tag + (s === 'meets' ? 'background: #F9F6FC; color: #471C72; border: 1px solid #471C72;' : (s === 'more' ? 'background: #E5E1D3; color: #1A1A1A;' : 'background: #F3E6DC; color: #7A4A21;')),
        meets: function () { set(d.id, 'meets'); }, more: function () { set(d.id, 'more'); }, undo: function () { set(d.id, null); } });
    });
    var tabs = [['open', 'To read · ' + openN], ['done', 'Read · ' + (defs.length - openN)], ['all', 'All']];
    return {
      rows: rows, empty: rows.length === 0,
      tabs: tabs.map(function (t) { var on = t[0] === tab; return { label: t[1], on: on ? 'true' : 'false',
        style: 'min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; cursor: pointer; color: #1A1A1A; ' + (on ? 'background: #FFFFFF; font-weight: 700;' : 'background: transparent; font-weight: 500;'),
        pick: function () { self.setState({ tab: t[0] }); } }; })
    };
  }
}
</script>
