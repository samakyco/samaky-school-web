<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { used: [], log: [] };
  }
  renderVals() {
    var self = this;
    var primary = 'display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #471C72; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 13px;';
    var ghost = 'display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #471C72; color: #471C72; text-decoration: none; font-weight: 700; font-size: 13px;';
    var bank = [
      { id: 'approve', label: 'Who still needs approval?', reply: 'Six entries are waiting, 15.5 hours in all, from Ava Thompson, Noah Kim, Mai Vang, Daniel Ortiz, Sofia Ramirez and Lucas Berg. Each one was already verified by the nonprofit. I can line them up, but your office makes the call.', actions: [{ label: 'Go approve', href: 'SchoolApprove.html', style: primary }] },
      { id: 'accred', label: 'Make my accreditation report', reply: 'From Jan to Oct 2026: 9,412 verified hours from 712 students, across 49 community courses and 22 partners. 7,980 of those hours are approved for credit. I set it up by course and major.', actions: [{ label: 'Open report', href: 'SchoolReports.html', style: primary }] },
      { id: 'behind', label: 'Which majors are behind on hours?', reply: 'Nursing and Engineering are furthest behind. 38 Nursing students and 21 Engineering students have less than half their required hours, and fall hours are due Dec 4.', actions: [{ label: 'See students', href: 'SchoolStudents.html', style: primary }, { label: 'See courses', href: 'SchoolCourses.html', style: ghost }] },
      { id: 'remind', label: 'Draft a reminder to students', reply: 'Here is a draft: "Hi! A quick reminder that fall service hours are due Dec 4. You can find open shifts on Samaky. Hours count once the nonprofit verifies them and our office approves them." It goes to the 59 students under half their hours, only after you send it.', actions: [{ label: 'Review recipients', href: 'SchoolStudents.html', style: primary }, { label: 'See calendar', href: 'SchoolCalendar.html', style: ghost }] }
    ];
    var meWrap = 'display: flex; flex-direction: column; align-items: flex-end;';
    var makyWrap = 'display: flex; flex-direction: column; align-items: flex-start;';
    var meBubble = 'max-width: 85%; background: #471C72; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 11px 15px; font-size: 15px; line-height: 1.45;';
    var makyBubble = 'max-width: 90%; background: #FAF9F5; color: #1A1A1A; border-radius: 18px 18px 18px 4px; padding: 12px 15px; font-size: 15px; line-height: 1.5;';
    var msgs = [{ wrap: makyWrap, bubble: makyBubble, text: 'Morning! Two things need your office today: 6 entries are waiting for approval, and NURS 210 hours are due Friday. What should we start with?', hasActions: false, actions: [] }];
    this.state.log.forEach(function (id) {
      var b = bank.filter(function (x) { return x.id === id; })[0];
      msgs.push({ wrap: meWrap, bubble: meBubble, text: b.label, hasActions: false, actions: [] });
      msgs.push({ wrap: makyWrap, bubble: makyBubble, text: b.reply, hasActions: true, actions: b.actions });
    });
    var chips = bank.filter(function (b) { return self.state.used.indexOf(b.id) === -1; }).map(function (b) {
      return { label: b.label, ask: function () { self.setState({ used: self.state.used.concat([b.id]), log: self.state.log.concat([b.id]) }); } };
    });
    return { msgs: msgs, chips: chips, hasChips: chips.length > 0, reset: function () { self.setState({ used: [], log: [] }); } };
  }
}
</script>
