  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: {}, pdf: {} };
  }
  setOne(id, v) {
    var st = Object.assign({}, this.state.st);
    if (v) { st[id] = v; } else { delete st[id]; }
    this.setState({ st: st });
  }
  renderVals() {
    var self = this;
    var st = this.state.st;
    var money = function (n) { return '$' + n.toFixed(2); };
    var defs = [
      { id: 'a', name: 'Ava Thompson', amt: 13.02, what: 'Blood drive greeter · North Star Blood Center · Oct 3', calc: '18.6 mi × $0.70/mi' },
      { id: 'b', name: 'Noah Kim', amt: 31.75, what: 'Tech help Tuesdays · Eastside Senior Commons · Oct 6', calc: 'Rideshare (Uber or Lyft) · receipt attached' },
      { id: 'c', name: 'Mai Vang', amt: 8.00, what: 'Pack meals for families · Northside Food Shelf · Oct 10', calc: 'Bus fare · 2 Metro Transit rides' }
    ];
    var tag = 'font-size: 14px; font-weight: 700; border-radius: 999px; padding: 7px 16px; ';
    var due = 0, pend = 0, paid = 4.00;
    var rows = defs.map(function (d) {
      var s = st[d.id];
      if (s === 'ok') { paid += d.amt; } else if (!s) { due += d.amt; pend++; }
      var ready = !!self.state.pdf[d.id];
      return {
        name: d.name, amt: money(d.amt), what: d.what, calc: d.calc,
        pending: !s, done: !!s,
        tag: s === 'ok' ? 'Approved' : (s === 'no' ? 'Denied' : 'Waiting for approval'),
        tagStyle: tag + (s === 'ok' ? 'background: #F9F6FC; color: #471C72; border: 1px solid #471C72;' : (s === 'no' ? 'background: #E5E1D3; color: #5E5B53;' : 'background: #F3E6DC; color: #7A4A21;')),
        pdfReady: ready,
        pdfNote: 'Reimbursement form for ' + d.name + ' saved as a PDF' + (s === 'ok' ? ' and ready for your finance office.' : '.'),
        approve: function () { self.setOne(d.id, 'ok'); },
        deny: function () { self.setOne(d.id, 'no'); },
        undo: function () { self.setOne(d.id, null); },
        pdf: function () { var p = Object.assign({}, self.state.pdf); p[d.id] = true; self.setState({ pdf: p }); }
      };
    });
    return {
      rows: rows,
      pendingCount: pend,
      dueTotal: money(due),
      dueLabel: pend === 1 ? '1 request to review' : pend + ' requests to review',
      paidTotal: money(paid)
    };
  }
}
</script>
