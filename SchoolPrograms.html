<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programs · Samaky for Schools</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#471C72}a:hover{color:#2E1149}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #471C72; color: #FFFFFF; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="index.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="margin: 0 2px 16px; padding: 14px; border-radius: 16px; background: #5B2E88; display: flex; align-items: center; gap: 12px;">
      <img src="brand/ust-shield.png" alt="University of St. Thomas shield" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; border: 0; box-sizing: border-box; background: #FFFFFF; object-fit: contain; display: block;">
      <div style="min-width: 0; line-height: 1.35;"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-weight: 600; font-size: 15px; color: #FAF9F5;">University of St. Thomas</span><span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; border-radius: 999px; padding: 2px 8px; background: #F3E6DC; color: #7A4A21;">Demo</span></div><div style="font-size: 12px; color: #E3D7F0; margin-top: 2px;">Service Learning Office · Fall 2026</div></div>
    </div>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 0 12px 6px;">Overview</div>
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="SchoolCalendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="SchoolEvents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Our events</a>
    <a href="SchoolReports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Review</div>
    <a href="SchoolApprove.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Approve hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolExpenses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Expenses<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">3</span></a>
    <a href="SchoolReflections.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Reflections<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolTranscripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcripts</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Students and courses</div>
    <a href="SchoolStudents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Students</a>
    <a href="SchoolPrograms.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; background: #FFFFFF; color: #471C72; font-weight: 700;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Programs</a>
    <a href="SchoolCourses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg>Community courses</a>
    <a href="SchoolPartners.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Partners</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Setup</div>
    <a href="SchoolCanvas.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect Canvas</a>
    <a href="SchoolProfile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Office and team</a>
    <a href="SchoolMaky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover; background: #FAF9F5;">Ask Maky</a>
    <div style="height: 8px;"></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Programs</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">Groups that run all year, outside of any one course. Each program has its own members, hour goal and paperwork.</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; border: 0; background: #471C72; color: #FFFFFF; min-height: 52px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New program</button>
    </div>

    <div role="group" aria-label="Choose a program" style="display: flex; flex-wrap: wrap; gap: 10px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px;">
      <div style="background: #F9F6FC; border: 1.5px solid #471C72; border-radius: 24px; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Members</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; color: #471C72; line-height: 1.1; margin-top: 6px;">{{p.members}}</div><div style="font-size: 14px; color: #5E5B53;">{{p.who}}</div></div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Hour goal</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; margin-top: 6px;">{{p.goal}}</div><div style="font-size: 14px; color: #5E5B53;">{{p.goalNote}}</div></div>
      <div style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;"><div style="font-size: 15px; color: #5E5B53;">Paperwork complete</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; margin-top: 6px;">{{p.paperPct}}</div><div style="font-size: 14px; color: #5E5B53;">{{p.lead}}</div></div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
      <section style="flex: 3 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 24px;">
        <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Members</h2>
        <sc-for list="{{rows}}" as="m" hint-placeholder-count="5">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 0; border-top: 1px solid #E5E1D3;">
            <div style="flex: 1 1 180px; min-width: 0;"><div style="font-weight: 700; font-size: 15px;">{{m.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{m.major}}</div></div>
            <div style="flex: 0 1 170px; min-width: 140px;"><div style="font-size: 13px; margin-bottom: 6px;"><span style="font-weight: 700;">{{m.hrs}}</span> of {{m.goal}} hrs</div><div style="height: 8px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 8px; border-radius: 999px; background: #471C72; width: {{m.pct}};"></div></div></div>
            <span style="{{m.tagStyle}}">{{m.paper}}</span>
            <sc-if value="{{m.needs}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{m.remind}}" disabled="{{m.sent}}" style="{{m.btnStyle}}">{{m.btn}}</button>
            </sc-if>
          </div>
        </sc-for>
      </section>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Required paperwork</h2>
          <p style="margin: 0 0 6px; font-size: 14px; color: #5E5B53; line-height: 1.5;">Students cannot sign up for program shifts until these are done.</p>
          <sc-for list="{{reqs}}" as="q" hint-placeholder-count="3">
            <div style="padding: 12px 0; border-top: 1px solid #E5E1D3;">
              <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 15px; margin-bottom: 6px;"><span style="font-weight: 700;">{{q.name}}</span><span style="color: #5E5B53; white-space: nowrap;">{{q.done}} of {{q.of}}</span></div>
              <div style="height: 8px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 8px; border-radius: 999px; background: #471C72; width: {{q.pct}};"></div></div>
            </div>
          </sc-for>
        </section>
        <section style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Next program events</h2>
          <sc-for list="{{nexts}}" as="n" hint-placeholder-count="2">
            <div style="padding: 10px 0; border-top: 1px solid #E5E1D3;"><div style="font-weight: 700; font-size: 15px;">{{n.t}}</div><div style="font-size: 13px; color: #5E5B53;">{{n.s}}</div></div>
          </sc-for>
          <a href="SchoolEvents.html" style="display: inline-block; margin-top: 8px; font-weight: 700; font-size: 14px;">See our events</a>
        </section>
      </aside>
    </div>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'heal', sent: {} };
  }
  renderVals() {
    var self = this;
    var P = {
      heal: { label: 'HEAL', members: 42, who: 'Students in health-related majors', goal: 15, goalNote: 'hours per term', paperPct: '88%', lead: 'Program lead: Ben Carter',
        reqs: [['Immunization record', 40, 42], ['Bloodborne pathogens training', 37, 42], ['Signed waiver', 42, 42]],
        nexts: [['Campus blood drive', 'Thu, Nov 12 · with North Star Blood Center'], ['Health fair helpers', 'Sat, Dec 5 · Eastside Senior Commons']],
        rows: [['Ava Thompson', 'Nursing', 9, 'Training missing'], ['Grace Lee', 'Nursing', 15, 'All done'], ['Mai Vang', 'Biology', 8, 'Immunization missing'], ['Jordan Price', 'Public Health', 12, 'Training expires Dec 1'], ['Hannah Ruiz', 'Exercise Science', 4, 'All done']] },
      days: { label: 'Service Days', members: 310, who: 'Open to every student', goal: 4, goalNote: 'service days per year', paperPct: '96%', lead: 'Program lead: Rosa Delgado',
        reqs: [['Signed waiver', 298, 310]],
        nexts: [['Fall food packing', 'Sat, Nov 21 · with Northside Food Shelf'], ['Spring river cleanup', 'Sat, Apr 17 · with Green Corridor Cleanup']],
        rows: [['Lucas Berg', 'Business', 3, 'All done'], ['Omar Hassan', 'Business', 4, 'All done'], ['Noah Kim', 'Engineering', 1, 'Waiver missing']] },
      tutors: { label: 'Community Tutors', members: 26, who: 'Tutoring in local schools', goal: 20, goalNote: 'hours per term', paperPct: '92%', lead: 'Program lead: Priya Shah',
        reqs: [['Background check', 24, 26], ['Mandated reporter training', 26, 26]],
        nexts: [['Tutor training night', 'Tue, Nov 10 · Room 201'], ['Reading buddies', 'Every Wednesday · Riverbend Literacy Project']],
        rows: [['Daniel Ortiz', 'Education', 6, 'All done'], ['Sofia Ramirez', 'Psychology', 11, 'Background check pending'], ['Elena Vu', 'Education', 18, 'All done']] }
    };
    var ids = ['heal', 'days', 'tutors'];
    var pick = this.state.pick; var p = P[pick];
    var base = 'min-height: 44px; padding: 0 22px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    var tag = 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; white-space: nowrap; ';
    var btn = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; ';
    return {
      chips: ids.map(function (id) { var on = id === pick; return { label: P[id].label, on: on ? 'true' : 'false',
        style: base + (on ? 'background: #471C72; color: #FFFFFF; border: 1.5px solid #471C72;' : 'background: #FFFFFF; color: #1A1A1A; border: 1.5px solid #E0DCCD;'),
        pick: function () { self.setState({ pick: id }); } }; }),
      p: p,
      reqs: p.reqs.map(function (q) { return { name: q[0], done: q[1], of: q[2], pct: Math.round(q[1] / q[2] * 100) + '%' }; }),
      nexts: p.nexts.map(function (n) { return { t: n[0], s: n[1] }; }),
      rows: p.rows.map(function (r) {
        var key = pick + r[0]; var ok = r[3] === 'All done'; var sent = !!self.state.sent[key];
        return { name: r[0], major: r[1], hrs: r[2], goal: p.goal, pct: Math.min(100, Math.round(r[2] / p.goal * 100)) + '%', paper: r[3], needs: !ok, sent: sent,
          tagStyle: tag + (ok ? 'background: #F9F6FC; color: #471C72; border: 1px solid #471C72;' : 'background: #F3E6DC; color: #7A4A21;'),
          btn: sent ? 'Reminder sent' : 'Remind',
          btnStyle: btn + (sent ? 'border: 0; background: #E5E1D3; color: #5E5B53; cursor: default;' : 'border: 1.5px solid #471C72; background: #FFFFFF; color: #471C72; cursor: pointer;'),
          remind: function () { var s = Object.assign({}, self.state.sent); s[key] = true; self.setState({ sent: s }); } };
      })
    };
  }
}
</script>

</body>
</html>
