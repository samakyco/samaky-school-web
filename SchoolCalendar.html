<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>

<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

    <a href="index.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>

    </div>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 0 12px 6px;">Overview</div>
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="SchoolCalendar.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; background: #FFFFFF; color: #471C72; font-weight: 700;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="SchoolEvents.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Our events</a>
    <a href="SchoolReports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Review</div>
    <a href="SchoolApprove.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Approve hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolExpenses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Expenses<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">3</span></a>
    <a href="SchoolReflections.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Reflections<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">6</span></a>
    <a href="SchoolTranscripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcripts</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Students and courses</div>

    <a href="SchoolPrograms.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Programs</a>
    <a href="SchoolCourses.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg>Community courses</a>
    <a href="SchoolPartners.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Partners</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #D9CCE8; padding: 18px 12px 6px;">Setup</div>
    <a href="SchoolCanvas.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect Canvas</a>
    <a href="SchoolProfile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Office and team</a>
    <a href="SchoolMaky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover; background: #FAF9F5;">Ask Maky</a>
    <div style="height: 8px;"></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Calendar</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">Your office's service events and community course deadlines in one place. Turn on the Samaky Giving Calendar to see the dates that matter for giving and service.</p>
      </div>
      <a href="SchoolCourses.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; border: 0; background: #471C72; color: #FFFFFF; min-height: 52px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add a course deadline</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
      <section style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <h2 style="margin: 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">November 2026</h2>
            <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer;"><input type="checkbox" checked="{{givingOn}}" onChange="{{toggleGiving}}" style="width: 20px; height: 20px; margin: 0; accent-color: #471C72; cursor: pointer;">Samaky Giving Calendar</label>
        </div>

        <sc-if value="{{givingOn}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #F3E6DC; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px;">
            <span style="font-weight: 700;">All month:</span>Native American Heritage Month
          </div>
        </sc-if>

        <div style="overflow-x: auto;">
          <div style="min-width: 640px;">
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px;">
              <sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
                <div style="font-size: 13px; font-weight: 700; color: #5E5B53; padding: 0 8px;">{{d}}</div>
              </sc-for>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
                <div style="{{c.cellStyle}}">
                  <div style="{{c.numStyle}}">{{c.num}}</div>
                  <sc-for list="{{c.events}}" as="e" hint-placeholder-count="1">
                    <div style="{{e.style}}">{{e.label}}</div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; font-size: 13px; color: #5E5B53;">
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #471C72;"></span>Service event</span>
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #F9F6FC; border: 1.5px solid #471C72; box-sizing: border-box;"></span>Course deadline</span>
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #B97F5B;"></span>Samaky Giving Calendar</span>
        </div>
      </section>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border: 1px solid #E0DCCD; border-radius: 24px; box-sizing: border-box; padding: 22px;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Coming up</h2>
          <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid #E5E1D3;">
              <div style="{{u.dateStyle}}">
                <div style="font-size: 11px; font-weight: 700; text-transform: uppercase;">{{u.mon}}</div>
                <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.1;">{{u.day}}</div>
              </div>
              <div style="flex: 1 1 auto; min-width: 0;">
                <div style="font-weight: 700; font-size: 15px;">{{u.title}}</div>
                <div style="font-size: 13px; color: #5E5B53;">{{u.sub}}</div>
              </div>
            </div>
          </sc-for>
        </section>
        <sc-if value="{{givingOn}}" hint-placeholder-val="{{true}}">
          <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 13px; font-weight: 700; color: #D9A27F; text-transform: uppercase; letter-spacing: 0.8px;">From the Samaky Giving Calendar</div>
            <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.15;">GivingTuesday is December 1, three days before fall hours are due.</div>
            <div style="font-size: 14px; color: #CFC9BD; line-height: 1.5;">A good week to nudge students who are short on hours toward open shifts.</div>
            <a href="SchoolMaky.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: #F9F6FC; color: #471C72; text-decoration: none; font-weight: 700; font-size: 15px; margin-top: 4px;">Draft a reminder with Maky</a>
          </section>
        </sc-if>
      </aside>
    </div>
  </main>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { giving: true };
  }
  renderVals() {
    var self = this;
    var giving = this.state.giving;
    var chip = 'font-size: 12px; font-weight: 700; line-height: 1.25; border-radius: 8px; padding: 4px 7px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; ';
    var styles = {
      event: chip + 'background: #471C72; color: #FFFFFF;',
      deadline: chip + 'background: #F9F6FC; color: #471C72; border: 1.5px solid #471C72;',
      giving: chip + 'background: #B97F5B; color: #1A1A1A;'
    };
    var evs = {
      'n4': [{ k: 'event', label: '11:00 Service fair' }],
      'n6': [{ k: 'deadline', label: 'NURS 210 hours due' }],
      'n12': [{ k: 'event', label: '10:00 Campus blood drive' }],
      'n18': [{ k: 'event', label: '4:00 Partner meetup' }],
      'n20': [{ k: 'deadline', label: 'EDUC 305 reflections' }],
      'n3': [{ k: 'giving', label: 'Election Day' }],
      'n11': [{ k: 'giving', label: 'Veterans Day' }],
      'n13': [{ k: 'giving', label: 'World Kindness Day' }],
      'n15': [{ k: 'giving', label: 'Natl. Philanthropy Day' }],
      'n26': [{ k: 'giving', label: 'Thanksgiving' }],
      'd1': [{ k: 'giving', label: 'GivingTuesday' }],
      'd4': [{ k: 'deadline', label: 'Fall hours due' }]
    };
    var cells = [];
    for (var i = 0; i < 35; i++) {
      var inNov = i < 30;
      var num = inNov ? i + 1 : i - 29;
      var key = (inNov ? 'n' : 'd') + num;
      var list = (evs[key] || []).filter(function (e) { return e.k !== 'giving' || giving; })
        .map(function (e) { return { label: e.label, style: styles[e.k] }; });
      var isToday = inNov && num === 1;
      cells.push({
        num: num, events: list,
        cellStyle: 'min-height: 104px; box-sizing: border-box; border-radius: 12px; padding: 8px; ' + (inNov ? 'background: #F5F3EC;' : 'background: #FFFFFF; border: 1px solid #E5E1D3;'),
        numStyle: 'font-size: 14px; font-weight: 700; width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (isToday ? 'background: #471C72; color: #FFFFFF;' : (inNov ? 'color: #1A1A1A;' : 'color: #6E6A62;'))
      });
    }
    var all = [
      { k: 'giving', mon: 'Nov', day: 3, title: 'Election Day', sub: 'Samaky Giving Calendar' },
      { k: 'event', mon: 'Nov', day: 4, title: 'Service fair', sub: 'Anderson Student Center · 14 partners' },
      { k: 'deadline', mon: 'Nov', day: 6, title: 'NURS 210 hours due', sub: 'Community Health · 64 students' },
      { k: 'event', mon: 'Nov', day: 12, title: 'Campus blood drive', sub: 'With North Star Blood Center' },
      { k: 'giving', mon: 'Nov', day: 13, title: 'World Kindness Day', sub: 'Samaky Giving Calendar' },
      { k: 'deadline', mon: 'Nov', day: 20, title: 'EDUC 305 reflections due', sub: 'Literacy in Schools · 28 students' }
    ];
    var bg = { event: 'background: #471C72; color: #FFFFFF;', deadline: 'background: #F9F6FC; color: #471C72; border: 1.5px solid #471C72;', giving: 'background: #B97F5B; color: #1A1A1A;' };
    var upcoming = all.filter(function (u) { return u.k !== 'giving' || giving; }).map(function (u) {
      return { mon: u.mon, day: u.day, title: u.title, sub: u.sub, dateStyle: 'width: 50px; flex: 0 0 50px; box-sizing: border-box; text-align: center; border-radius: 12px; padding: 6px 0; ' + bg[u.k] };
    });
    return {
      dows: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      cells: cells,
      upcoming: upcoming,
      givingOn: giving,
      toggleGiving: function () { self.setState({ giving: !self.state.giving }); }
    };
  }
}
</script>

</body>
</html>
