<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samaky for Schools</title>
<link rel="icon" href="brand/maky.png">
<style>
html,body{margin:0;height:100%;background:#FAF9F5}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" title="Samaky for Schools"></iframe>
<script>
(function () {
  // Every screen opens inside this frame, so the address bar always shows just the domain.
  var frame = document.getElementById('app');
  var start = 'SchoolHome.html';
  try {
    var saved = sessionStorage.getItem('samaky-start');
    sessionStorage.removeItem('samaky-start');
    if (saved && /^[A-Za-z0-9_-]+\.html$/.test(saved)) { start = saved; }
  } catch (e) {}
  frame.src = start;
  frame.addEventListener('load', function () {
    try { if (frame.contentDocument.title) { document.title = frame.contentDocument.title; } } catch (e) {}
  });
})();
</script>
</body>
</html>
